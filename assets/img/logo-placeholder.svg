<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ReactionCreator logo placeholder</title>
  <desc id="desc">A placeholder brand mark using the ReactionCreator color palette.</desc>
  <defs>
    <linearGradient id="body" x1="72" y1="64" x2="440" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1EC8C1"/>
      <stop offset="1" stop-color="#00A88F"/>
    </linearGradient>
    <linearGradient id="lens" x1="150" y1="140" x2="380" y2="388" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6C2CF1"/>
      <stop offset="1" stop-color="#4A1FC7"/>
    </linearGradient>
    <linearGradient id="play" x1="42" y1="166" x2="132" y2="346" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD43B"/>
      <stop offset="1" stop-color="#FF8A00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#111827" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#F6F7FB"/>
  <path d="M62 180c0-21 23-34 41-23l94 58c17 10 17 35 0 45l-94 58c-18 11-41-2-41-23V180Z" fill="url(#play)" filter="url(#shadow)"/>
  <rect x="102" y="82" width="342" height="342" rx="76" fill="url(#body)" filter="url(#shadow)"/>
  <circle cx="273" cy="254" r="129" fill="url(#lens)" stroke="#EDE7FF" stroke-width="10"/>
  <circle cx="273" cy="254" r="83" fill="#FFD43B"/>
  <circle cx="393" cy="126" r="43" fill="#FFFFFF"/>
  <circle cx="393" cy="126" r="30" fill="#FF1D35"/>
  <text x="273" y="245" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="78" font-weight="900">RC</text>
  <text x="273" y="302" text-anchor="middle" fill="#241600" font-family="Arial, sans-serif" font-size="28" font-weight="900">LOGO</text>
  <text x="273" y="334" text-anchor="middle" fill="#241600" font-family="Arial, sans-serif" font-size="20" font-weight="700">PLACEHOLDER</text>
</svg>
